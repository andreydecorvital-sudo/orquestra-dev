name: Windows launcher smoke
on:
  pull_request:
permissions:
  contents: read
jobs:
  parse-windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Parse PowerShell syntax without running installers
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          $path = Join-Path $env:GITHUB_WORKSPACE 'launcher\OrquestraMenu.ps1'
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'Launcher PowerShell syntax valid'
      - name: Verify batch wrapper references menu
        shell: powershell
        run: |
          $launcher = Get-Content ABRIR-ORQUESTRA.cmd -Raw
          if ($launcher -notmatch 'launcher\\OrquestraMenu.ps1') { throw 'Menu missing from double click entrypoint' }
      - name: Verify Python CLI syntax
        run: python -m compileall -q cli
