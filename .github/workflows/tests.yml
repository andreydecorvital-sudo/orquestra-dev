name: Orquestra quality gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Python syntax
        run: python3 -m compileall -q gateway runner orchestration
      - name: Browser JS syntax
        run: node --check web-live/app.js
      - name: Chrome bridge scripts and protocol
        run: |
          node --check web-live/browser-mode.js
          node --check web-live/connections.js
          node --check browser-bridge/background.js
          node --check browser-bridge/content.js
          node tests/browser_bridge_mock.cjs
      - name: Extension ZIP integrity
        run: |
          unzip -t downloads/orquestra-browser-bridge-v0.1.0.zip
          unpacked="$(mktemp -d)"
          unzip -q downloads/orquestra-browser-bridge-v0.1.0.zip -d "$unpacked"
          test -f "$unpacked/manifest.json"
          test -f "$unpacked/background.js"
          test -f "$unpacked/content.js"
          cmp "$unpacked/manifest.json" browser-bridge/manifest.json
          cmp "$unpacked/background.js" browser-bridge/background.js
          cmp "$unpacked/content.js" browser-bridge/content.js
      - name: Hermes bridge is pure-Python
        run: python3 -m py_compile gateway/hermes_bridge.py
      - name: Build cloud diagnostic Docker image (when present)
        if: ${{ hashFiles('cloud/Dockerfile') != '' }}
        run: docker build -f cloud/Dockerfile -t orquestra-cloud-smoke:ci .
      - name: Validate Hermes readiness and cloud start fail-closed
        if: ${{ hashFiles('cloud/Dockerfile') != '' }}
        run: |
          docker run --rm --entrypoint python orquestra-cloud-smoke:ci -m cloud.hermes_smoke > hermes-status.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path("hermes-status.json").read_text())
          assert value['status'] == 'hermes_not_installed', value['status']
          assert not value['oauth_login_initiated']
          assert not value['inference_tested']
          assert not value['tokens_exposed']
          print('Hermes smoke: blocked without runtime, no login or inference')
          PY
          set +e
          docker run --rm orquestra-cloud-smoke:ci > cloud-startup.log 2>&1
          exit_code=$?
          set -e
          test "$exit_code" -eq 1
          grep -q 'ORQUESTRA_CLOUD_PILOT_BLOCKED' cloud-startup.log
          echo 'Cloud diagnostic worker: correctly blocked without backend pairing'
      - name: Block tracked secrets
        run: |
          test ! -f runner/agent-worker.json
          test ! -f gateway/config.json
          test ! -f runner/config.json
          test ! -f .env
