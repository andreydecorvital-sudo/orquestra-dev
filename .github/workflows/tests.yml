name: Orquestra quality gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Python syntax
        run: python3 -m compileall -q gateway runner orchestration
      - name: Browser JS syntax
        run: node --check web-live/app.js
      - name: Chrome bridge scripts and protocol
        run: |
          node --check web-live/browser-mode.js
          node --check web-live/connections.js
          node --check browser-bridge/background.js
          node --check browser-bridge/content.js
          node tests/browser_bridge_mock.cjs
      - name: Extension ZIP integrity
        run: |
          unzip -t downloads/orquestra-browser-bridge-v0.1.0.zip
          unpacked="$(mktemp -d)"
          unzip -q downloads/orquestra-browser-bridge-v0.1.0.zip -d "$unpacked"
          test -f "$unpacked/manifest.json"
          test -f "$unpacked/background.js"
          test -f "$unpacked/content.js"
          cmp "$unpacked/manifest.json" browser-bridge/manifest.json
          cmp "$unpacked/background.js" browser-bridge/background.js
          cmp "$unpacked/content.js" browser-bridge/content.js
      - name: Hermes bridge is pure-Python
        run: python3 -m py_compile gateway/hermes_bridge.py
      - name: Block tracked secrets
        run: |
          test ! -f runner/agent-worker.json
          test ! -f gateway/config.json
          test ! -f runner/config.json
          test ! -f .env
